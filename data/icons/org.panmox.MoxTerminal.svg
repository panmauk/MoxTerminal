    <path d="M40 46 L60 64 L40 82"/>
    <line x1="68" y1="84" x2="92" y2="84"/>
  </g>

  <!-- signature PANMOX dot -->
  <circle cx="98" cy="30" r="7" fill="#ff3d8a"/>
  <circle cx="98" cy="30" r="11" fill="#ff3d8a" opacity="0.30"/>
